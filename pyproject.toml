[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptcheck"
version = "0.1.0"
description = "CLI tool to validate AI prompts for quality, risk, and cost."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "promptcheck contributors" }
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
  "python-dotenv>=1.0.0",
  "openai>=1.40.0"
]

[project.scripts]
promptcheck = "promptcheck.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptcheck*"]
